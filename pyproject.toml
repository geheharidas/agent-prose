[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-prose"
version = "1.0.2"
description = "Deterministic Anti-RLHF Stylometric Gate for Autonomous Agents by Nitivra"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Nitivra", email = "gehe@nitivra.com.au" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
]
keywords = [
    "llm",
    "autonomous-agents",
    "anti-rlhf",
    "stylometrics",
    "writing-quality",
    "pre-commit",
    "linter",
    "burstiness",
    "cadence",
]
dependencies = []

[project.scripts]
agent-prose = "agent_prose.cli:main"

[project.urls]
Homepage = "https://github.com/geheharidas/agent-prose"
Repository = "https://github.com/geheharidas/agent-prose.git"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_prose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

